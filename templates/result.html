<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prediction Result</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('/static/farm2.jpg') center/cover;
            color: white;
        }
        .result-container {
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 50px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .crop-name {
            font-size: 2.5em;
            color: #2e8b57;
            font-weight: bold;
            display: block;
            margin: 20px 0;
        }
        .back-link {
            text-decoration: none;
            color: white;
            background: #2e8b57;
            padding: 10px 20px;
            border-radius: 5px;
            transition: 0.3s;
        }
        .back-link:hover { background: #1e5e3a; }
    </style>
</head>
<body>
    <div class="result-container">
        <h1>Best Crop to Grow:</h1>
        <span class="crop-name">✨ {{ prediction_text }} ✨</span>
        <p>Based on your soil and environmental conditions.</p>
        <br>
        <a href="/" class="back-link">Go Back</a>
    </div>
</body>
</html>
