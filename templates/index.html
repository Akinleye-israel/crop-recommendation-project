<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Crop Recommendation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        #welcome {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            background-image: url('/static/farm.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: white;
        }

        #welcome::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.3);
            z-index: 0;
        }

        #welcome h1, #welcome p, #welcome button {
            position: relative;
            z-index: 1;
        }

        #welcome button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 1em;
            border: none;
            border-radius: 6px;
            background-color: rgba(46,139,87,0.8);
            color: white;
            cursor: pointer;
        }

        #welcome button:hover { background-color: rgba(60,179,113,0.8); }

        #main-form {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 50px 20px;
            background-image: url('/static/farm2.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            color: white;
        }

        #main-form::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.3);
            z-index: 0;
        }

        #main-form form {
            position: relative;
            z-index: 1;
            background-color: rgba(255,255,255,0.9);
            padding: 20px;
            border-radius: 8px;
            max-width: 400px;
            width: 90%;
        }

        input[type="number"], input[type="submit"] {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            border-radius: 4px;
        }

        input[type="submit"] {
            background-color: #2e8b57;
            color: white;
            border: none;
            cursor: pointer;
        }

        input[type="submit"]:hover { background-color: #3cb371; }
    </style>
</head>
<body>

    <!-- Welcome Section -->
    <div id="welcome">
        <h1>🌾 Welcome to Crop Recommendation!</h1>
        <p>Get the best crop suggestion based on soil and weather data.</p>
        <button onclick="showForm()">Get Started</button>
    </div>

    <!-- Main Form Section -->
    <div id="main-form">
        <h1>🌾 Crop Recommendation</h1>
        <!-- Form submits to /predict route -->
        <form action="/predict" method="post">
            <input type="number" step="any" name="N" placeholder="Nitrogen (N)" required>
            <input type="number" step="any" name="P" placeholder="Phosphorus (P)" required>
            <input type="number" step="any" name="K" placeholder="Potassium (K)" required>
            <input type="number" step="any" name="temperature" placeholder="Temperature (°C)" required>
            <input type="number" step="any" name="humidity" placeholder="Humidity (%)" required>
            <input type="number" step="any" name="ph" placeholder="Soil pH" required>
            <input type="number" step="any" name="rainfall" placeholder="Rainfall (mm)" required>
            <input type="submit" value="Predict Crop">
        </form>
    </div>

    <script>
        function showForm() {
            document.getElementById('welcome').style.display = 'none';
            document.getElementById('main-form').style.display = 'flex';
        }
    </script>

</body>
</html>
